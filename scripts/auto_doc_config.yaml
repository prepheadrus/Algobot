## 🚨 SORUN GİDERME

### **Hook Çalışmıyor**

**Windows:**
```powershell
# Hook path'i kontrol et
git config core.hooksPath

# Eğer boşsa veya yanlışsa:
git config core.hooksPath .git/hooks

# Hook dosyasının çalıştırılabilir olduğundan emin ol
icacls .git/hooks/post-commit /grant Everyone:RX
```

### **Python Script Hatası**

```bash
# Python yolunu kontrol et
where python  # Windows
which python3  # Linux/Mac

# Script'i manuel test et
python scripts/auto_doc_bot.py

# Hata mesajını kontrol et
```

### **GitHub Actions Çalışmıyor**

```
1. GitHub → Settings → Actions → General
2. "Allow all actions" aktif olmalı
3. Workflow dosyasının syntax'ını kontrol et:
   yamllint .github/workflows/auto-doc-bot.yml
```

---

## 🔄 MANUEL GÜNCELLEME

Eğer otomatik sistem çalışmazsa:

```bash
# Manuel çalıştır
python scripts/auto_doc_bot.py

# Güncellenen dokümanları kontrol et
git status

# Commit et
git add docs/architecture/
git commit -m "Docs: Manuel dokümantasyon güncelleme"
```

---

## 📈 İSTATİSTİKLER

**Her Otomatik Güncelleme:**
- ✅ Versiyon numarası +1 artırılır
- ✅ Tarih güncellenir
- ✅ Değişen dosyalar listelenir
- ✅ İlgili bölüme eklenir

**Tahmini Süre:**
- Hook çalışması: < 2 saniye
- Doküman güncelleme: < 5 saniye
- Toplam: < 10 saniye

---

## 💡 EN İYİ UYGULAMALAR

1. **Her Commit'ten Sonra Kontrol Et:**
   ```bash
   git commit -m "Feature: XYZ"
   git status  # docs/architecture/ güncellenmiş mi?
   ```

2. **Pull Request Öncesi:**
   ```bash
   # Son commit'i kontrol et
   git log -1
   git diff HEAD~1 docs/architecture/
   ```

3. **Haftalık Özet:**
   ```bash
   # Haftalık değişiklikleri gör
   git log --since="1 week ago" -- docs/architecture/
   ```

