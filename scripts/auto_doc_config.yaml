# 🤖 AUTO-DOC BOT - Yapılandırma

**Versiyon:** v1.0
**Son Güncelleme:** 17 Mart 2026

---

## 📋 GENEL BAKIŞ

Auto-Doc Bot, her git commit'tan sonra `docs/architecture/` klasöründeki 3 ana dokümanı otomatik günceller.

---

## 🔧 KURULUM

### **1. Yerel Geliştirme (Post-Commit Hook)**

```bash
# Windows (PowerShell - Admin olarak çalıştır)
cd "f:\Crypto Bot"

# Hook'u aktif et
git config core.hooksPath .git/hooks

# Manuel test
python scripts/auto_doc_bot.py
```

**Hook otomatik çalışacak:**
```bash
git commit -m "Feature: Yeni endpoint eklendi"
# → Post-commit hook otomatik çalışır
# → auto_doc_bot.py çalışır
# → Dokümanlar güncellenir
```

---

### **2. GitHub Actions (CI/CD)**

**Otomatik Aktif:**
- ✅ `.github/workflows/auto-doc-bot.yml` oluşturuldu
- ✅ Her `push` ve `pull_request`'ta çalışır
- ✅ Güncellenen dokümanlar otomatik commit edilir

**İlk Push Sonrası Kontrol:**
```
1. GitHub → Actions sekmesine git
2. "Auto-Doc Bot" workflow'u göründüğünden emin ol
3. İlk commit'ten sonra workflow çalışacak
4. "Docs: Otomatik dokümantasyon güncelleme" commit'i görünecek
```

---

## ⚙️ YAPILANDIRMA DOSYASI

**Dosya:** `scripts/auto_doc_config.yaml`

```yaml
# Auto-Doc Bot Konfigürasyonu

# Güncellenecek dokümanlar
docs:
  - path: docs/architecture/MASTER_PROJE_DESTANI.md
    categories:
      - core/
      - shared/
      - strategy/
      - bot_manager
      - position_manager
  
  - path: docs/architecture/TASKS_AND_TRACEABILITY.md
    categories:
      - api/
      - ml/
      - frontend/
      - router
      - service
  
  - path: docs/architecture/TRADING_RULES_AND_RISK.md
    categories:
      - risk_engine
      - config.yaml
      - komisyon
      - slippage

# Versiyon formatı
versioning:
  format: "v{major}.{minor}"
  auto_increment: true

# Tarih formatı
date_format: "%d %B %Y"

# Log seviyesi
log_level: INFO  # DEBUG, INFO, WARNING, ERROR
```

