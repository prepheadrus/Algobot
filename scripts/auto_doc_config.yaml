## 📊 ÇALIŞMA PRENSİBİ

### **Commit Öncesi:**
```bash
git add api/routers/bot.py
git commit -m "Feature: Resume-all endpoint"
```

### **Commit Sonrası (Otomatik):**
```
🤖 AUTO-DOC BOT çalışıyor...
📝 Commit mesajı: Feature: Resume-all endpoint
📁 Değişen dosyalar: 1
📄 TASKS_AND_TRACEABILITY.md güncelleniyor...
✅ TASKS_AND_TRACEABILITY.md güncellendi

💡 Güncellenen dosyaları eklemek için:
   git add docs/architecture/
```

