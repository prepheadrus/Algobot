version: '3.8'

services:
  # TimescaleDB (PostgreSQL with Time-Series capabilities)
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: cryptobot_db
    restart: always
    environment:
      - POSTGRES_USER=cryptoboss
      - POSTGRES_PASSWORD=cryptopass
      - POSTGRES_DB=cryptobot
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data

  # Redis for in-memory caching and real-time state
  redis:
    image: redis:alpine
    container_name: cryptobot_redis
    restart: always
    ports:
      - "6379:6379"
